[package]
name = "linexin-python-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Embedded CPython loader for legacy Linexin Center Python widgets"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
pyo3 = { version = "0.27", features = ["auto-initialize"] }
linexin-localization = { path = "../localization" }
linexin-services = { path = "../services" }
